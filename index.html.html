```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Escolar</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 25px;
            color: #1e293b;
        }

        .contenedor {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1, h2 { color: #1d4ed8; }

        .formulario {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            font-size: 15px;
        }

        button {
            cursor: pointer;
            border: none;
            color: white;
            background: #2563eb;
        }

        button:hover { opacity: 0.88; }
        .eliminar { background: #dc2626; }
        .editar { background: #059669; margin-right: 5px; }
        .cancelar { background: #64748b; }

        .tabla-contenedor { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border-bottom: 1px solid #e2e8f0;
            padding: 12px;
            text-align: left;
        }

        th { background: #dbeafe; }

        #mensaje {
            margin: 12px 0;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .categorias {
            background: #eff6ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
<div class="contenedor">
    <h1>Inventario Escolar</h1>
    <p>Registra, consulta, edita y elimina los productos del inventario.</p>

    <section class="categorias">
        <h2>Categorías</h2>

        <form id="formCategoria" class="formulario">
            <input id="nombreCategoria" type="text"
                   placeholder="Nombre de la categoría" required>
            <button type="submit">Agregar categoría</button>
        </form>

        <p id="listaCategorias">Conectando con la base de datos...</p>
    </section>

    <h2 id="tituloFormulario">Registrar producto</h2>

    <form id="formProducto" class="formulario">
        <input id="nombre" type="text"
               placeholder="Nombre del producto" required>

        <input id="precio" type="number"
               placeholder="Precio" min="0" step="0.01" required>

        <input id="cantidad" type="number"
               placeholder="Cantidad" min="0" step="1" required>

        <select id="categoria" required>
            <option value="">Selecciona una categoría</option>
        </select>

        <button type="submit" id="botonGuardar">Guardar producto</button>

        <button type="button" id="botonCancelar"
                class="cancelar" hidden>Cancelar edición</button>
    </form>

    <p id="mensaje" role="status"></p>

    <h2>Productos registrados</h2>

    <div class="tabla-contenedor">
        <table>
            <thead>
                <tr>
                    <th>Producto</th>
                    <th>Precio</th>
                    <th>Cantidad</th>
                    <th>Categoría</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
                <tr><td colspan="5">Cargando productos...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
(() => {
    const URL_SUPABASE = "https://ivgrdukylaofrhlggagi.supabase.co";
    const CLAVE_PUBLICA = "sb_publishable_HYUw9uGsl9z_zlt9XrYyHA_6IRAR27M";

    const listaCategorias = document.getElementById("listaCategorias");
    const tablaProductos = document.getElementById("tablaProductos");
    const mensaje = document.getElementById("mensaje");
    const formularioProducto = document.getElementById("formProducto");
    const formularioCategoria = document.getElementById("formCategoria");
    const campoNombre = document.getElementById("nombre");
    const campoPrecio = document.getElementById("precio");
    const campoCantidad = document.getElementById("cantidad");
    const campoCategoria = document.getElementById("categoria");

    let clienteSupabase;
    let productos = [];
    let categorias = [];
    let productoEditando = null;

    function mostrarMensaje(texto, error = false) {
        mensaje.textContent = texto;
        mensaje.style.color = error ? "#dc2626" : "#15803d";
    }

    function mostrarErrorConexion(error) {
        console.error("Error de conexión con Supabase:", error);
        mostrarMensaje(
            "Error de conexión: " + (error.message || String(error)),
            true
        );
    }

    async function cargarCategorias() {
        listaCategorias.textContent = "Cargando categorías...";

        const { data, error } = await clienteSupabase
            .from("categorias")
            .select("id, nombre")
            .order("nombre");

        if (error) {
            listaCategorias.textContent = "No se pudieron cargar las categorías.";
            mostrarErrorConexion(error);
            return;
        }

        categorias = data || [];

        listaCategorias.textContent = categorias.length
            ? categorias.map(c => c.nombre).join(" · ")
            : "Todavía no hay categorías.";

        campoCategoria.innerHTML =
            '<option value="">Selecciona una categoría</option>';

        categorias.forEach(categoria => {
            const opcion = document.createElement("option");
            opcion.value = categoria.id;
            opcion.textContent = categoria.nombre;
            campoCategoria.appendChild(opcion);
        });
    }

    async function cargarProductos() {
        const { data, error } = await clienteSupabase
            .from("productos")
            .select("id, nombre, precio, cantidad, categoria_id, categorias(nombre)")
            .order("id", { ascending: false });

        if (error) {
            tablaProductos.innerHTML =
                '<tr><td colspan="5">Error al cargar productos: ' +
                escaparHTML(error.message) + '</td></tr>';
            mostrarErrorConexion(error);
            return;
        }

        productos = data || [];
        dibujarProductos();
    }

    function escaparHTML(valor) {
        return String(valor ?? "").replace(/[&<>"']/g, caracter => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[caracter]);
    }

    function dibujarProductos() {
        tablaProductos.innerHTML = "";

        if (productos.length === 0) {
            tablaProductos.innerHTML =
                '<tr><td colspan="5">No hay productos registrados.</td></tr>';
            return;
        }

        productos.forEach(producto => {
            const fila = document.createElement("tr");

            [
                producto.nombre,
                "$" + Number(producto.precio).toFixed(2),
                producto.cantidad,
                producto.categorias
                    ? producto.categorias.nombre
                    : "Sin categoría"
            ].forEach(valor => {
                const celda = document.createElement("td");
                celda.textContent = valor ?? "";
                fila.appendChild(celda);
            });

            const acciones = document.createElement("td");

            const editar = document.createElement("button");
            editar.textContent = "Editar";
            editar.className = "editar";
            editar.addEventListener("click", () => editarProducto(producto));

            const eliminar = document.createElement("button");
            eliminar.textContent = "Eliminar";
            eliminar.className = "eliminar";
            eliminar.addEventListener("click", () => eliminarProducto(producto.id));

            acciones.append(editar, eliminar);
            fila.appendChild(acciones);
            tablaProductos.appendChild(fila);
        });
    }

    formularioCategoria.addEventListener("submit", async evento => {
        evento.preventDefault();

        const input = document.getElementById("nombreCategoria");
        const nombre = input.value.trim();

        if (!nombre) {
            mostrarMensaje("Escribe el nombre de la categoría.", true);
            return;
        }

        const { error } = await clienteSupabase
            .from("categorias")
            .insert([{ nombre }]);

        if (error) {
            mostrarMensaje("No se pudo agregar la categoría: " + error.message, true);
            return;
        }

        input.value = "";
        mostrarMensaje("Categoría agregada correctamente.");
        await cargarCategorias();
    });

    formularioProducto.addEventListener("submit", async evento => {
        evento.preventDefault();

        const nombre = campoNombre.value.trim();
        const precio = Number(campoPrecio.value);
        const cantidad = Number(campoCantidad.value);
        const categoriaId = campoCategoria.value;

        if (
            !nombre ||
            campoPrecio.value === "" ||
            campoCantidad.value === "" ||
            !Number.isFinite(precio) ||
            precio < 0 ||
            !Number.isInteger(cantidad) ||
            cantidad < 0 ||
            !categoriaId
        ) {
            mostrarMensaje("Completa correctamente todos los campos.", true);
            return;
        }

        const registro = {
            nombre,
            precio,
            cantidad,
            categoria_id: Number(categoriaId)
        };

        const resultado = productoEditando !== null
            ? await clienteSupabase.from("productos")
                .update(registro).eq("id", productoEditando)
            : await clienteSupabase.from("productos").insert([registro]);

        if (resultado.error) {
            mostrarMensaje("Error al guardar el producto: " + resultado.error.message, true);
            return;
        }

        mostrarMensaje(
            productoEditando !== null
                ? "Producto actualizado correctamente."
                : "Producto agregado correctamente."
        );

        limpiarFormulario();
        await cargarProductos();
    });

    function editarProducto(producto) {
        productoEditando = producto.id;
        campoNombre.value = producto.nombre;
        campoPrecio.value = producto.precio;
        campoCantidad.value = producto.cantidad;
        campoCategoria.value = producto.categoria_id ?? "";

        document.getElementById("tituloFormulario").textContent = "Editar producto";
        document.getElementById("botonGuardar").textContent = "Guardar cambios";
        document.getElementById("botonCancelar").hidden = false;

        formularioProducto.scrollIntoView({ behavior: "smooth" });
    }

    async function eliminarProducto(id) {
        if (!confirm("¿Seguro que deseas eliminar este producto?")) return;

        const { error } = await clienteSupabase
            .from("productos")
            .delete()
            .eq("id", id);

        if (error) {
            mostrarMensaje("Error al eliminar el producto: " + error.message, true);
            return;
        }

        mostrarMensaje("Producto eliminado correctamente.");
        await cargarProductos();
    }

    function limpiarFormulario() {
        formularioProducto.reset();
        productoEditando = null;

        document.getElementById("tituloFormulario").textContent = "Registrar producto";
        document.getElementById("botonGuardar").textContent = "Guardar producto";
        document.getElementById("botonCancelar").hidden = true;
    }

    document.getElementById("botonCancelar")
        .addEventListener("click", limpiarFormulario);

    async function iniciar() {
        try {
            if (!window.supabase || typeof window.supabase.createClient !== "function") {
                throw new Error(
                    "No se cargó la biblioteca de Supabase. Comprueba tu conexión a internet y recarga la página."
                );
            }

            clienteSupabase = window.supabase.createClient(
                URL_SUPABASE,
                CLAVE_PUBLICA
            );

            await cargarCategorias();
            await cargarProductos();
        } catch (error) {
            listaCategorias.textContent = "No se pudo iniciar el inventario.";
            tablaProductos.innerHTML =
                '<tr><td colspan="5">No se pudo conectar con la base de datos.</td></tr>';
            mostrarErrorConexion(error);
        }
    }

    iniciar();
})();
</script>
</body>
</html>
```
